<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Engram</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Ccircle cx='10' cy='10' r='9' stroke='%237C6AFF' stroke-width='1.5' fill='none'/%3E%3Ccircle cx='7' cy='8' r='2' fill='%237C6AFF' opacity='.6'/%3E%3Ccircle cx='13' cy='8' r='2' fill='%237C6AFF' opacity='.6'/%3E%3Ccircle cx='10' cy='13' r='2' fill='%237C6AFF'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint to avoid a light-theme flash.
      (function () {
        try {
          var t = localStorage.getItem('engram-theme');
          if (t !== 'light' && t !== 'dark' && t !== 'glass' && t !== 'frost') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) { /* default theme */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
