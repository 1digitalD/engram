[pytest]
# Add the repo root to sys.path so `from app import ...` and `from services ...`
# resolve when pytest collects tests. Without this, running `pytest tests/unit/`
# from the repo root fails with `ModuleNotFoundError: No module named 'app'`
# even though app.py is in cwd. Equivalent to running with `PYTHONPATH=.`.
pythonpath = .
testpaths = tests