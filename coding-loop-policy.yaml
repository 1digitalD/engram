primaryExecutor: opencode
fallbackExecutors:
  - cursor
  - codex
  - claude
platform: openclaw
allowExecutorFallback: true
requireHumanForDependencies: true
publication:
  branchPrefix: loopsmith
  pushEnabled: false
  prEnabled: false

# Per Loopsmith docs: 300s default is too low for tasks that build JS from a
# fresh worktree (npm install, build, test). Set to 1800s (30 min) for any
# task touching TS/JS, including the engram UI in ui/. Reads via
# policy.extra.executorLaunchTimeoutSeconds (see src/loopsmith/policy.py).
executorLaunchTimeoutSeconds: 1800

# Cooldown before retrying same executor (seconds). Lets rate limits reset.
sameExecutorCooldownSeconds: 60

# Cross-executor retry budget. Slice is abandoned after this many
# distinct executors have failed.
maxCrossExecutorRetries: 2
